server:
  port: 8080

spring:
  application:
    name: library-management
  datasource:
    url: jdbc:h2:file:./data/librarydb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans

app:
  security:
    jwt:
      secret: "ReplaceThisWithAStrongSecretKeyForJWTGeneration"
      expiration-minutes: 120
  cors:
    allowed-origins: "http://localhost:5173,http://127.0.0.1:5173"
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "*"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
